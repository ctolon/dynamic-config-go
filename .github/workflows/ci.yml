name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Filesystem semantics are the part of this library most likely to differ
  # between platforms, which makes the matrix load-bearing rather than
  # decorative.
  test:
    name: test (${{ matrix.os }}, go ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ['1.24', 'stable']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          check-latest: true

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -count=1 ./...

  race:
    name: race detector
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      # A library claiming concurrency safety treats a race-detector
      # failure as a release blocker, not a flake.
      - name: Test under -race
        run: go test -race -count=1 ./...

  vet:
    name: vet and staticcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: gofmt
        run: |
          unformatted=$(gofmt -l -s .)
          if [ -n "$unformatted" ]; then
            echo "not gofmt-ed:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: staticcheck
        run: make staticcheck

      - name: go mod tidy is clean
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

  fuzz:
    name: fuzz smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      # Short on every push; the scheduled run in security.yml goes deeper.
      - name: Fuzz the reload boundary
        run: go test -run '^$' -fuzz FuzzReloadDocument -fuzztime 60s .

      - name: Fuzz the lifecycle model
        run: go test -run '^$' -fuzz FuzzLifecycleModel -fuzztime 60s .

      - name: Upload failing corpus
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-corpus
          path: testdata/fuzz/

  bench:
    name: benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      # The allocation promise is a test, so a regression fails here rather
      # than sitting in a benchmark nobody read.
      - name: Allocation assertions
        run: go test -count=1 -run TestCurrentDoesNotAllocate ./benchmarks/

      - name: Benchmarks
        run: go test -run '^$' -bench . -benchmem -benchtime 100ms ./benchmarks/

  examples:
    name: examples build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Build every example
        run: go build -o /dev/null ./examples/...

  # One check for branch protection to require. A matrix produces a check
  # per combination, and their names change whenever the matrix does; this
  # job's name does not, so the protection rule survives editing the matrix.
  ci-green:
    name: CI is green
    runs-on: ubuntu-latest
    needs: [test, race, vet, fuzz, bench, examples]
    if: always()
    steps:
      - name: Every job succeeded
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "::error::a required job did not pass"
            exit 1
          fi
