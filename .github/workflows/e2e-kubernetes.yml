name: Kubernetes end-to-end

on:
  schedule:
    # Weekly. The kubelet's sync period makes this a slow test, and what it
    # covers changes rarely — but claiming Kubernetes support on the
    # strength of synthetic filesystem tests alone is claiming it on faith.
    - cron: '43 5 * * 1'
  workflow_dispatch:
  push:
    # The pieces this test is about: the watcher, the manifests, the
    # example and the script itself.
    paths:
      - 'watch.go'
      - 'reload.go'
      - 'examples/kubernetes/**'
      - 'scripts/e2e-kubernetes.sh'
      - '.github/workflows/e2e-kubernetes.yml'

permissions:
  contents: read

jobs:
  kind:
    name: ConfigMap update reaches a running pod
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - name: Install kind
        uses: helm/kind-action@v1
        with:
          install_only: true

      # Proves the whole chain rather than a piece of it: kubectl, the API
      # server, the kubelet's sync, the projected volume it writes, the
      # watcher inside the container, and the reload that follows — with
      # the pod never restarting.
      - name: Run the end-to-end test
        run: ./scripts/e2e-kubernetes.sh

      - name: Cluster state on failure
        if: failure()
        run: |
          kubectl get pods -o wide || true
          kubectl describe deployment/example || true
          kubectl logs -l app=example --tail=200 || true
