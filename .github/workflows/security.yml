name: Security

on:
  push:
    branches: [main, dev]
  pull_request:
  schedule:
    # Weekly, so that a vulnerability disclosed after a release is still
    # found before the next one.
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Scan for known vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  deep-fuzz:
    name: extended fuzzing
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Fuzz the reload boundary
        run: go test -run '^$' -fuzz FuzzReloadDocument -fuzztime 10m .

      - name: Fuzz subscriber operations
        run: go test -run '^$' -fuzz FuzzSubscriberOperations -fuzztime 10m .

      - name: Upload failing corpus
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-corpus
          path: testdata/fuzz/

  security-green:
    name: Security is green
    runs-on: ubuntu-latest
    needs: [govulncheck]
    if: always()
    steps:
      - name: Every job succeeded
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "::error::a required job did not pass"
            exit 1
          fi
