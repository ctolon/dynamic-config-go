name: Security

on:
  push:
    branches: [main, dev]
  pull_request:
  schedule:
    # Weekly, so that a vulnerability disclosed after a release is still
    # found before the next one.
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: Scan for known vulnerabilities
        run: make vuln

  soak:
    name: soak
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v7
        with:
          go-version: stable

      # Readers, writers, subscribers and reloads all at once, for long
      # enough that what only appears with time has a chance to: a counter
      # that drifts, a goroutine that accumulates, memory that grows with
      # the number of events rather than with the size of the
      # configuration.
      - name: Soak for fifteen minutes
        run: go test -race -count=1 -run TestSoak -soak 15m -v ./integration/

  deep-fuzz:
    name: extended fuzzing
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: Fuzz the reload boundary
        run: go test -run '^$' -fuzz FuzzReloadDocument -fuzztime 10m .

      - name: Fuzz the lifecycle model
        run: go test -run '^$' -fuzz FuzzLifecycleModel -fuzztime 10m .

      - name: Upload failing corpus
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-corpus
          path: testdata/fuzz/

  security-green:
    name: Security is green
    runs-on: ubuntu-latest
    needs: [govulncheck, soak]
    if: always()
    steps:
      - name: Every job succeeded
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "::error::a required job did not pass"
            exit 1
          fi
